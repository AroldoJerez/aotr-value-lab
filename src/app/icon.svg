<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f4f5"/>
      <stop offset="100%" stop-color="#c9ccd1"/>
    </linearGradient>
    <linearGradient id="hilt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
  </defs>

  <!-- fondo -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="92" fill="none" stroke="#ef4444" stroke-opacity="0.35" stroke-width="6"/>

  <!-- espada 1 (diagonal \) -->
  <g transform="rotate(45 256 256)">
    <rect x="246" y="90" width="20" height="230" rx="4" fill="url(#blade)"/>
    <polygon points="256,70 236,100 276,100" fill="url(#blade)"/>
    <rect x="216" y="320" width="80" height="18" rx="6" fill="url(#hilt)"/>
    <rect x="246" y="330" width="20" height="70" rx="6" fill="url(#hilt)"/>
    <circle cx="256" cy="404" r="14" fill="url(#hilt)"/>
  </g>

  <!-- espada 2 (diagonal /) -->
  <g transform="rotate(-45 256 256)">
    <rect x="246" y="90" width="20" height="230" rx="4" fill="url(#blade)"/>
    <polygon points="256,70 236,100 276,100" fill="url(#blade)"/>
    <rect x="216" y="320" width="80" height="18" rx="6" fill="url(#hilt)"/>
    <rect x="246" y="330" width="20" height="70" rx="6" fill="url(#hilt)"/>
    <circle cx="256" cy="404" r="14" fill="url(#hilt)"/>
  </g>
</svg>
